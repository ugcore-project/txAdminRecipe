# -----------------------------------
#  ug-core
# -----------------------------------

# ug-core applies staff groups and grants as ACEs. These four commands are the only ones it runs,
# so it gets nothing else.
add_ace resource.ug-core command.add_ace allow
add_ace resource.ug-core command.remove_ace allow
add_ace resource.ug-core command.add_principal allow
add_ace resource.ug-core command.remove_principal allow

# -----------------------------------
#  Groups
# -----------------------------------

# ug-core defines the groups in resources/[ug]/ug-core/config/permissions.lua:
#   moderator    weight 10
#   admin        weight 50, inherits moderator, has ug.admin (the `ug` command in game)
#   founder      weight 100, inherits admin

# Admins MAY run every server command from the game.
add_ace group.admin command allow
add_ace group.admin command.quit deny

# -----------------------------------
#  Staff
# -----------------------------------

# One line per identifier, with the name as a comment. For example:
#   add_principal identifier.license:<license> group.moderator      # Name
#   add_principal identifier.discord:<id> group.founder               # Name

# The txAdmin master account, added by the recipe.
{{addPrincipalsMaster}}
