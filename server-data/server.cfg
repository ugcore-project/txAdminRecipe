# -----------------------------------
#  Network
# -----------------------------------

{{serverEndpoints}}
sv_maxclients {{maxClients}}

# -----------------------------------
#  Game
# -----------------------------------

# The game build every client runs. Newer builds bring newer clothes, vehicles and map changes.
# https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild-build
sv_enforceGameBuild {{gameBuild}}

# -----------------------------------
#  Files
# -----------------------------------

# Be careful when ordering this. The startup order matters.
# resources read secrets and convars when they start, so resources.cfg should run last.
exec secrets.cfg
exec convars.cfg
exec permissions.cfg
exec resources.cfg
