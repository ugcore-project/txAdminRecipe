# -----------------------------------
#  License
# -----------------------------------

# From https://portal.cfx.re
sv_licenseKey "{{svLicense}}"

# -----------------------------------
#  Database
# -----------------------------------

# Read by oxmysql. ug-core creates and migrates its tables on start.
# Format: mysql://user:password@host:port/database?charset=utf8mb4
set mysql_connection_string "{{dbConnectionString}}"

# -----------------------------------
#  Webhooks
# -----------------------------------

# Discord webhook for ug-admin's audit log: every staff action and report.
# https://discord.com/api/webhooks/<id>/<token>. Empty sends nothing. Anyone with the URL can post in that channel.
set ug-admin:Webhook ""
