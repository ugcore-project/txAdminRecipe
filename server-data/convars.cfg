# -----------------------------------
#  FXServer
# -----------------------------------

# The chat built into FXServer. ug-core sends it command suggestions.
set resources_useSystemChat true

# Hides player IP addresses from public server reports.
sv_endpointPrivacy true

# Script Hook V lets clients call any native. Keep it off.
sv_scriptHookAllowed 0

# 1 blocks modified client files except audio and known graphics mods. 2 blocks them all.
sv_pureLevel 1

# -----------------------------------
#  Protection (OneSync)
# -----------------------------------

# relaxed: clients MUST NOT create networked script entities. The server spawns them, as every ug resource does.
# strict also blocks ambient traffic and peds. Use inactive only if a third-party resource spawns networked
# entities from its client and you cannot replace it.
sv_entityLockdown relaxed

# 1 stops clients from taking control of vehicles other players drive. 2 covers every entity players control.
sv_filterRequestControl 1

# Stops clients from playing sounds on other clients.
sv_enableNetworkedSounds false

# Only the server MAY write player and entity state bags. ug resources never write them from clients, but
# pma-voice does (proximity, radio and call volume). Enable it only without pma-voice. Needs server 12739 or newer.
# setr sv_stateBagStrictMode true

# -----------------------------------
#  Steam
# -----------------------------------

# steam_webApiKey no longer works since 04 November 2026: players link Steam to their Cfx account instead.
# true refuses players without a linked Steam account. Needs server 38004 or newer.
# ug-core identifies players by license, so Steam is optional.
# sv_enforceSteamAuth true

# -----------------------------------
#  oxmysql
# -----------------------------------

# Queries slower than this many ms are logged.
set mysql_slow_query_warning 150

# The `mysql` command opens a query log, for players allowed command.mysql.
set mysql_ui true

# -----------------------------------
#  pma-voice
# -----------------------------------

# https://github.com/AvarianKnight/pma-voice#config

# The game's own audio: 3D sound, echo, and the radio and call effects. Enable only one audio mode.
setr voice_useNativeAudio true

# Players hear only those in range, and nobody can join the voice server from outside the game.
setr voice_useSendingRangeOnly true

# ug-hud shows voice modes and talking, so pma-voice's own UI is off.
setr voice_enableUi 0

# -----------------------------------
#  ug-core
# -----------------------------------

# Every value below is the default. A convar wins over resources/[ug]/ug-core/config/*.lua, so the same option in
# the file is ignored. `ug config <name>` in the server console shows each value and where it came from.
# Tables can only be set in the files: jobs, gangs, accounts, groups, items, shops, needs, stashes, the downed,
# dead and respawn settings. Booleans take true, false, 1 or 0.

## Core
# Language of core messages and logs: a file in ug-core/locales/.
set ug-core:Locale "en"
# Debug logs on the server and in client F8.
set ug-core:Debug false

## Modules
# Optional modules. identity, players and permissions are always on. Disabling a module never deletes its data.
# A module whose dependency is off stops the boot with a message that says which one to enable.
set ug-core:Modules:Characters true
set ug-core:Modules:Accounts true
set ug-core:Modules:Jobs true
set ug-core:Modules:Gangs true
set ug-core:Modules:Sessions true
set ug-core:Modules:Commands true
set ug-core:Modules:Locale true
set ug-core:Modules:Items true
set ug-core:Modules:Inventory true
set ug-core:Modules:Weapons true
set ug-core:Modules:Shops true
set ug-core:Modules:Needs true

## Guard
# Score removed from every player per minute.
set ug-core:Guard:DecayPerMinute 1
# Score that logs a warning with recent flags. 0 disables it.
set ug-core:Guard:WarnScore 10
# Score that kicks the player. 0 disables it.
set ug-core:Guard:KickScore 25
# Score that bans the player. 0 disables it. Set it once you trust your resources.
set ug-core:Guard:BanScore 0
# Burst of net events and callbacks per player, across every resource, refilled in BudgetPer ms.
set ug-core:Guard:BudgetMax 40
set ug-core:Guard:BudgetPer 1000

## Identity
# Identifier that identifies a player: license, license2, steam, discord or fivem. Players without it cannot connect.
# Changing it on a live server orphans every existing character and ban.
set ug-core:Identity:PrimaryIdentifier "license"

## Players
# Saves death state, injuries and cause of death with the character, so disconnecting never revives.
set ug-core:Players:PersistDeathState true

## Characters
# Characters a player MAY own, 1 to 32. Deleted characters do not count.
set ug-core:Characters:MaxCharacters 4
# Saves the last position, read from the ped on the server, every PositionInterval ms. 0 saves on unload,
# disconnect and stop only.
set ug-core:Characters:PersistPosition true
set ug-core:Characters:PositionInterval 300000

## Inventory
# Slots and maximum weight in grams of a player inventory.
set ug-core:Inventory:PlayerSlots 50
set ug-core:Inventory:PlayerWeight 30000
# Maximum distance in meters to give items to another player.
set ug-core:Inventory:GiveDistance 3.0
# Empties player inventories on respawn, except items with keepOnRespawn.
set ug-core:Inventory:ClearOnRespawn false

## Weapons
# Removes and flags weapons a player holds without having equipped them from the inventory.
set ug-core:Weapons:Enforce true

## Needs
# Ms between two need ticks, 1000 to 300000.
set ug-core:Needs:Interval 10000
# Needs stop changing while downed or dead, and go back to their start value on respawn.
set ug-core:Needs:PauseWhileDown true
set ug-core:Needs:ResetOnRespawn true

# -----------------------------------
#  ug-lib
# -----------------------------------

# Same rule: these win over resources/[ug]/ug-lib/config/*.lua. `uglib config <name>` shows the source.
# Tables (currency, menuKeys, lockedSettings, theme colors) can only be set in the files.

## Settings
# Language of ug-lib labels: a file in ug-lib/locales/.
set ug-lib:Locale "en"
# auto follows ug-core:Debug. off or on.
set ug-lib:Debug "auto"
# Screen anchors: top-left, top, top-right, center-left, center, center-right, bottom-left, bottom, bottom-right.
set ug-lib:NotifyPosition "top-right"
set ug-lib:TextUIPosition "bottom"
set ug-lib:ProgressPosition "bottom"
set ug-lib:MenuPosition "top-left"
set ug-lib:ContextPosition "center-right"
# Ms a notification stays, 0 until dismissed. At most NotifyMax per anchor.
set ug-lib:NotifyDuration 5000
set ug-lib:NotifyMax 5
# Default keys. Players MAY rebind them in their FiveM key settings. An empty RadialKey disables the global radial.
set ug-lib:CancelKey "X"
set ug-lib:RadialKey "F1"
# How often, in ms, the client cache reads the local player and zones check its position.
set ug-lib:CacheInterval 100
set ug-lib:ZoneInterval 250
# Frontend sounds when menus select and close.
set ug-lib:Sounds true
# Players MAY change their own theme, accent, scale and positions with this chat command. Saved on their PC.
set ug-lib:PlayerSettings true
set ug-lib:SettingsCommand "uisettings"

## Theme
# dark or light.
set ug-lib:Theme:Mode "dark"
# Corner radius of panels and buttons, in rem or px.
set ug-lib:Theme:Radius "0.5rem"
# Only bundled fonts: ug-lib loads nothing from the network.
set ug-lib:Theme:Font "Inter"
# UI scale, 0.75 to 1.5.
set ug-lib:Theme:Scale 1.0
